services:
  server:
    build: ./server
    container_name: bill_generator_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Database Connection
      - MONGO_URI=mongodb://${DB_MONGO_USER}:${DB_MONGO_PASS}@${DB_HOST}:27017/bill-generator?authSource=admin
      - PORT=5000
      
      # Supabase Auth Connection
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY} # Uncomment if your backend needs admin-level access to Supabase